<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- A client report is not public material. If it is ever put on a web server,
     or shared through a link that a crawler can reach, it must stay out of
     every index. -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<title>%%TITLE%%</title>
<!-- Built to the Wellows design system. One brand blue #0452F0, one typeface
     (Parkinsans, inlined below as base64 so the report keeps the brand face
     with no network access), section backgrounds only from the sanctioned set,
     emerald/rose/amber for status, three shadow steps, one focus ring.
     No dark mode: dark sections are a choice inside a light page, not a theme. -->
<style>
%%FONTS%%
:root {
  /* Brand */
  --brand: #0452F0; --brand-hover: #0452f0cf; --accent: #056BF2;
  --sky: #4E8BFF; --pale: #ABCEF6; --blue-fill: #EEF4FF; --blue-surface: #E6EEFE;
  --deep: #0047AB;
  /* Text */
  --ink: #212529; --ink-2: #6C757D; --strong: #111111; --muted: #888888;
  /* Surfaces and borders */
  --surface: #FFFFFF; --tint: #F4F5F7; --card-grey: #F0F0F0; --near-black: #0A0A0A;
  --line: #E5E7EB; --line-strong: #E9ECEF; --line-stronger: #CED4DA; --hairline: #E7E7E7;
  /* Status: emerald / rose / amber, never green / red / yellow */
  --ok: #065F46; --ok-bg: #ECFDF5; --ok-line: #A7F3D0;
  --bad: #881337; --bad-bg: #FFF1F2; --bad-line: #FECDD3;
  --warn: #78350F; --warn-bg: #FFFBEB; --warn-line: #FDE68A;
  --font: "Parkinsans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Helvetica Neue", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, Menlo, monospace;
  --bar-h: 68px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--bar-h) + 16px); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--surface); color: var(--ink); font-family: var(--font);
  font-size: 16px; line-height: 24px; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-weight: 600; color: var(--ink); margin: 0; }
a { color: var(--brand); text-underline-offset: 4px; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.hero :focus-visible, .deep :focus-visible { outline-color: #fff; }

/* Container: wider than the marketing 1440 because a 133-row audit is a
   document, not a landing page, and the side margins were wasted space. */
.shell { width: 100%; max-width: 1600px; margin: 0 auto; padding-inline: 20px; }
@media (min-width: 640px) { .shell { padding-inline: 32px; } }
@media (min-width: 1024px) { .shell { padding-inline: 48px; } }

/* Header: sticky, 68px, frosted. bg-white first, translucency behind the
   supports() guard, so a browser without backdrop-filter still reads. */
.topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 50; background: #fff;
  border-bottom: 1px solid var(--line-strong); padding-top: env(safe-area-inset-top, 0px);
  transition: box-shadow 200ms ease-out; }
@supports (backdrop-filter: blur(20px)) {
  .topbar { background: rgba(255,255,255,.72); backdrop-filter: blur(20px) saturate(180%); }
}
.topbar.pinned { box-shadow: 0 2px 10px rgba(16,24,40,0.06); }
.topbar-inner { height: var(--bar-h); display: flex; align-items: center; gap: 16px; }
.mark { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; white-space: nowrap; color: var(--ink); }
.mark i { width: 10px; height: 10px; border-radius: 3px; background: var(--brand); display: inline-block; }
.where { flex: 1; min-width: 0; font-size: 14px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.where b { color: var(--ink); font-weight: 500; }
.pct { font-size: 13px; font-weight: 500; color: var(--brand); background: var(--blue-surface);
  padding: 4px 12px; border-radius: 9999px; white-space: nowrap; }
.track { height: 3px; background: var(--line); position: relative; }
.fill { height: 100%; width: 0; background: var(--brand); }

/* Booking call to action, in the bar beside the reading progress. It sits
   inside the existing 68px bar, so the bar keeps its height and its sticky
   behaviour. The touch target is 44px, which fits with room to spare. */
.cta { display: inline-flex; align-items: center; justify-content: center;
  min-height: 44px; padding: 0 18px; border-radius: 12px; flex: 0 0 auto;
  font-family: var(--font); font-size: 14px; font-weight: 600; line-height: 1;
  white-space: nowrap; text-decoration: none; color: #FFFFFF;
  background: var(--brand); transition: background-color 200ms ease-out, box-shadow 200ms ease-out; }
.cta:hover, .cta:focus { background: var(--deep); text-decoration: none; }
.cta:focus-visible { outline: 2px solid #FFFFFF; outline-offset: -4px;
  box-shadow: 0 0 0 4px rgba(4,82,240,0.35); }
.cta-short { display: none; }
@media (prefers-reduced-motion: reduce) { .cta { transition: none; } }

/* Hero: pale wash, dark text. Never white text on this gradient. */
.hero { background: linear-gradient(to bottom, var(--blue-surface), #fff);
  padding-top: calc(var(--bar-h) + 40px); padding-bottom: 48px; border-bottom: 1px solid var(--line); }
.eyebrow { font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: -0.03em; color: var(--brand); margin: 0 0 12px; }
.hero h1 { font-size: 36px; line-height: 40px; letter-spacing: -0.01em; max-width: 24ch; }
@media (min-width: 640px) { .hero h1 { font-size: 40px; line-height: 44px; } }
.hero h1 em { font-style: normal; color: var(--brand); }
.hero .lead { margin: 16px 0 0; max-width: 78ch; color: var(--ink-2); font-size: 16px; }
@media (min-width: 1024px) { .hero .lead { font-size: 18px; } }
.tiles { display: grid; gap: 12px; margin-top: 24px; max-width: 980px; }
.bar { display: flex; height: 12px; border-radius: 9999px; overflow: hidden; background: var(--blue-fill); }
.seg { display: block; height: 100%; }
.keys { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; color: var(--ink-2); }
.key { display: inline-flex; align-items: center; gap: 7px; }
.key i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex: none; }
.key b { color: var(--ink); font-weight: 600; }
.b-pass { background: #10B981; } .b-crit { background: #9F1239; } .b-high { background: #E11D48; }
.b-med { background: #D97706; } .b-low { background: #94A3B8; } .b-need { background: #F59E0B; }
.b-nt { background: #CBD5E1; }

/* Body layout */
.wrap { display: grid; grid-template-columns: 252px minmax(0, 1fr); gap: 48px;
  padding-block: 32px 96px; align-items: start; }
.toc { position: sticky; top: calc(var(--bar-h) + 24px); max-height: calc(100vh - var(--bar-h) - 48px); overflow: auto; }
.toc h3, .filters h3 { font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: -0.03em; color: var(--brand); margin: 0 0 12px; }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.toc a { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; padding: 7px 12px;
  border-radius: 8px; color: var(--ink-2); text-decoration: none; font-size: 14px; line-height: 20px; }
.toc a:hover { background: var(--tint); color: var(--brand); }
.toc a.active { background: var(--blue-surface); color: var(--brand); font-weight: 600; }
.toc .n { font-size: 12px; color: var(--muted); }
.toc a.active .n { color: var(--brand); }
.toc .c { font-size: 12px; font-weight: 600; color: var(--bad); }
main { min-width: 0; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 24px;
  position: sticky; top: calc(var(--bar-h) + 1px); z-index: 40; background: #fff; padding-block: 12px; }
.filters h3 { margin: 0 8px 0 0; }
.chip { font: inherit; font-size: 14px; font-weight: 600; line-height: 1; border: 1px solid var(--line);
  background: #fff; color: var(--strong); border-radius: 12px; padding: 10px 16px; cursor: pointer;
  box-shadow: 0 1px 2px rgba(16,24,40,0.05); transition: border-color 200ms ease-out, color 200ms ease-out; }
.chip:hover { border-color: var(--brand); color: var(--brand); }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff;
  box-shadow: 0 4px 12px rgba(4,82,240,0.25); }

.sec { padding-block: 8px 32px; border-bottom: 1px solid var(--line); margin-bottom: 32px; }
.sec:last-child { border-bottom: 0; }
h2 { font-size: 32px; line-height: 36px; letter-spacing: -0.02em; margin: 0 0 12px; display: flex; gap: 12px; align-items: baseline; }
@media (min-width: 640px) { h2 { font-size: 36px; line-height: 40px; } }
.secnum { font-size: 13px; font-weight: 600; color: var(--brand); background: var(--blue-surface);
  padding: 4px 10px; border-radius: 8px; flex: none; letter-spacing: 0; }
h3 { font-size: 20px; line-height: 24px; letter-spacing: -0.01em; margin: 24px 0 12px; }
.intro, .sec > p { max-width: 86ch; color: var(--ink-2); font-size: 16px; }
@media (min-width: 1024px) { .intro { font-size: 18px; } }
/* Summary: narrative at a readable measure, key figures in a panel beside it.
   Splitting three paragraphs into newspaper columns left a ragged, unbalanced
   gap. A report puts the numbers in the space instead. */
.summary-grid { display: grid; gap: 32px; align-items: start; }
@media (min-width: 1280px) { .summary-grid { grid-template-columns: minmax(0, 1fr) 340px; gap: 56px; } }
.prose { max-width: 72ch; }
.prose p:first-child { margin-top: 0; }
.glance { border: 1px solid var(--line); border-radius: 12px; background: var(--tint); padding: 24px; }
.glance h3 { margin: 0 0 16px; font-size: 14px; font-weight: 600; text-transform: uppercase;
  letter-spacing: -0.03em; color: var(--brand); }
.glance dl { margin: 0; display: grid; gap: 0; }
.glance div { display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
  padding: 10px 0; border-bottom: 1px solid var(--line); }
.glance div:last-child { border-bottom: 0; padding-bottom: 0; }
.glance dt { font-size: 15px; color: var(--ink-2); }
.glance dd { margin: 0; font-size: 20px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.glance dd.is-ok { color: var(--ok); } .glance dd.is-bad { color: var(--bad); }
.sec.hide, .toc li.hide { display: none; }
#fcount { font-size: 14px; color: var(--ink-2); margin-left: 4px; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: #fff; margin: 16px 0; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th { text-align: left; font-size: 14px; font-weight: 600; color: var(--ink); background: var(--tint);
  padding: 12px 16px; white-space: nowrap; border-bottom: 1px solid var(--line-strong); }
td { padding: 14px 16px; border-bottom: 1px solid var(--line-strong); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.id { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
td.ck { font-weight: 600; min-width: 180px; }
td.ev { min-width: 300px; color: var(--ink-2); overflow-wrap: anywhere; }
td.fx { min-width: 280px; }
td.fx .imp { color: var(--ink-2); display: block; margin-bottom: 8px; }
tr.hide { display: none; }

.pill { display: inline-flex; align-items: center; font-size: 13px; font-weight: 500;
  padding: 4px 12px; border-radius: 8px; white-space: nowrap; }
.v-pass { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok-line); }
.v-issue { background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad-line); }
.v-need { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-line); }
.v-nt, .v-na { background: var(--card-grey); color: var(--ink); }
.s-critical { background: var(--bad); color: #fff; }
.s-high { background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad-line); }
.s-medium { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-line); }
.s-low { background: var(--card-grey); color: var(--ink); }
.p-p0 { background: var(--bad); color: #fff; }
.p-p1 { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-line); }
.p-p2 { background: var(--blue-surface); color: var(--brand); }

.top { counter-reset: n; list-style: none; padding: 0; display: grid; gap: 12px; max-width: 100%; }
.top li { counter-increment: n; background: #fff; border: 1px solid var(--line); border-radius: 12px;
  padding: 16px 20px 16px 60px; position: relative; box-shadow: 0 1px 2px rgba(16,24,40,0.05); }
.top li::before { content: counter(n); position: absolute; left: 18px; top: 16px; width: 28px; height: 28px;
  border-radius: 9999px; background: linear-gradient(to bottom right, var(--brand), var(--accent));
  color: #fff; font-weight: 600; font-size: 14px; display: grid; place-items: center; }
/* Scoped off the pill: a bare ".top li span" outranks ".pill" and was turning
   the severity badge into a grey block. */
.top li > span:not(.pill) { display: block; color: var(--ink-2); font-size: 15px; }
.tophead { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 6px; }
.tophead b { font-size: 18px; font-weight: 600; color: var(--ink); }
.tophead .chk { font-family: var(--mono); font-size: 13px; color: var(--brand); text-decoration: none;
  background: var(--blue-surface); padding: 3px 10px; border-radius: 8px; white-space: nowrap; }
.tophead .chk:hover { background: var(--brand); color: #fff; }
.top .fixline { margin-top: 8px; color: var(--ink); }

.well { list-style: none; padding: 0; display: grid; gap: 10px 48px; max-width: none; }
@media (min-width: 1280px) { .well { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.well li { padding-left: 28px; position: relative; color: var(--ink-2); }
.well li::before { content: "\2713"; position: absolute; left: 0; top: 0; color: var(--ok); font-weight: 700; }
code { font-family: var(--mono); font-size: .88em; background: var(--tint); padding: 2px 6px; border-radius: 6px; overflow-wrap: anywhere; }
.foot { color: var(--muted); font-size: 14px; line-height: 20px; padding-top: 16px; }

/* Evidence citation */
.src { display: block; margin-top: 6px; font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.src::before { content: "source: "; }
/* Addresses inside a finding are clickable, so the reader can check the page
   the finding is about without retyping it. */
a.u { color: var(--brand); text-decoration: underline; text-decoration-thickness: 1px;
      text-underline-offset: 2px; overflow-wrap: anywhere; }
a.u:hover { color: var(--brand-hover); }
a.u:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 2px; }
.lede { color: var(--ink-2); max-width: 72ch; margin: 0 0 20px; }
/* The JavaScript on and off pair. Full-page captures are tall, so they sit in
   a scrollable frame of equal height rather than stretching the section. */
.shot-js { flex: 1 1 0; min-width: 0; }
.shot-js img { width: 100%; height: auto; max-height: 720px; object-fit: cover;
               object-position: top; border: 1px solid var(--line); border-radius: 12px; }
.jsnote { color: var(--ink-2); margin: 0 0 14px; max-width: 72ch; }
.scope { margin: 20px 0 0; padding-top: 16px; border-top: 1px solid var(--line);
         color: var(--ink-2); max-width: 72ch; }
.scope a { color: var(--brand); }

/* Overview dashboard. Cards are a definition of the audit, not decoration:
   every bar is a link into the section it counts. Drawn as inline SVG so it
   renders with JavaScript off and prints. */
.ogrid { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 720px) { .ogrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1100px) { .ogrid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ocard-wide { grid-column: span 3; } }
/* The three rings live in the hero. They sit on the pale wash, so the cards
   stay white and align to the top rather than stretching to the tallest. */
.ogrid-rings { margin-top: 36px; align-items: stretch; }
@media (min-width: 720px) { .ogrid-rings { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.ogrid-rings .ocard { box-shadow: 0 1px 2px rgba(16,24,40,0.04); justify-content: flex-start; }
/* The verdict legend stays in one column: two made "Needs client data" and
   "Not applicable" wrap onto three lines each. The cards share a height and
   align to the top, so the three headings and the three rings line up across
   the row; the card with the longest legend simply fills more of its box. */
.ocard { border: 1px solid var(--line); border-radius: 12px; background: #fff; padding: 24px;
  display: flex; flex-direction: column; align-items: center; text-align: center; }
.ocard-wide { align-items: stretch; text-align: left; }
.ocard h3 { font-size: 15px; font-weight: 600; color: var(--ink-2); margin: 0 0 16px;
  letter-spacing: .01em; }
.donut { display: block; margin: 0 auto 14px; }
.dnum { font-size: 30px; font-weight: 700; fill: var(--strong); font-family: var(--font); }
.dsub { font-size: 12px; fill: var(--ink-2); font-family: var(--font); }
.onote { font-size: 13px; color: var(--ink-2); margin: 0; }
.ocard-wide .onote { margin: -8px 0 14px; }
.okeys { list-style: none; margin: 0; padding: 0; width: 100%; }
.okeys li, .okeys li a { display: flex; align-items: center; gap: 8px; font-size: 13px;
  padding: 5px 0; color: var(--ink); text-decoration: none; }
.okeys li a { width: 100%; border-radius: 8px; padding: 5px 6px; }
.okeys li a:hover { background: var(--blue-fill); }
.okeys i { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
.okeys span { flex: 1; text-align: left; }
.okeys b { font-variant-numeric: tabular-nums; }
.obars { list-style: none; margin: 0; padding: 0; }
.obars li a { display: grid; grid-template-columns: minmax(96px, 210px) 1fr 3ch 72px 14px;
  align-items: center; gap: 14px; padding: 0 8px; min-height: 40px; border-radius: 8px;
  color: var(--ink); text-decoration: none; }
.obars li a:hover { background: var(--blue-fill); }
.obars li a:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.olab { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.otrack { background: var(--tint); border-radius: 9999px; height: 10px; overflow: hidden; }
.otrack i { display: block; height: 100%; border-radius: 9999px; }
.obars b { font-variant-numeric: tabular-nums; font-size: 15px; min-width: 2ch; text-align: right; }
.obars em { font-style: normal; font-size: 12px; color: var(--bad); white-space: nowrap; }
.obars-link li a::after { content: "\\2192"; color: var(--brand); opacity: 0; transition: opacity 200ms ease-out; }
.obars-link li a:hover::after, .obars-link li a:focus-visible::after { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .obars-link li a::after { transition: none; } }
.is-warn { color: var(--warn); font-weight: 600; }

/* In-page booking panels. Same link and same button as the bar, set on the
   sanctioned blue surface so it reads as an offer rather than a stray control. */
.ctapanel { margin-top: 32px; display: flex; flex-wrap: wrap; align-items: center;
  justify-content: space-between; gap: 20px; padding: 24px 28px;
  background: var(--blue-surface); border-radius: 12px; }
.ctapanel h3 { margin: 0 0 4px; font-size: 18px; font-weight: 700; color: var(--strong); }
.ctapanel p { margin: 0; color: var(--ink-2); font-size: 14px; max-width: 62ch; }
.cta-panel { flex: 0 0 auto; }
@media (max-width: 639px) { .ctapanel { padding: 20px; }
  .cta-panel { width: 100%; } }
@media print { .ctapanel { background: none; border: 1px solid var(--line); } }
/* Deep links */
td.id a.anchor { color: var(--brand); text-decoration: none; }
td.id a.anchor:hover { text-decoration: underline; }
a.jump { color: inherit; text-decoration: none; }
td.id a.jump { font-family: var(--mono); color: var(--brand); margin-right: 6px; }
td.id a.jump:hover { text-decoration: underline; }
tr:target { background: var(--blue-surface); box-shadow: inset 3px 0 0 var(--brand); }
/* References */
.refs { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
.refs-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: -0.03em; color: var(--brand); }
a.ref { font-size: 13px; color: var(--brand); text-decoration: underline; text-underline-offset: 4px; }
a.ref:hover { text-decoration: none; }
/* Captures */
.shotrow { margin: 0 0 32px; }
.shotrow h3 { font-family: var(--mono); font-size: 14px; font-weight: 500; color: var(--brand);
  background: var(--blue-surface); display: inline-block; padding: 6px 14px; border-radius: 8px; margin: 0 0 14px; }
.shots { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.shot { margin: 0; }
.shot img { display: block; max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
.devcap { display: flex; align-items: center; gap: 0; margin-bottom: 10px; font-size: 13px; }
.devcap .dev { background: var(--brand); color: #fff; font-weight: 600; padding: 5px 12px; border-radius: 8px 0 0 8px; }
.devcap .dim { background: #fff; color: var(--ink-2); font-family: var(--mono); padding: 5px 12px;
  border-radius: 0 8px 8px 0; border: 1px solid var(--line); border-left: 0; }
.appendix-open { border-bottom: 0; margin-bottom: 8px; padding-bottom: 4px; }
/* Back to top */
#totop { position: fixed; right: 24px; bottom: 24px; z-index: 40; width: 48px; height: 48px; border-radius: 9999px;
  border: 0; background: var(--brand); color: #fff; font-size: 18px; line-height: 1; cursor: pointer;
  display: grid; place-items: center; opacity: 0; visibility: hidden;
  transition: opacity 200ms ease-out, transform 200ms ease-out, box-shadow 200ms ease-out;
  box-shadow: 0 4px 12px rgba(4,82,240,0.25); }
#totop.show { opacity: 1; visibility: visible; }
#totop:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(4,82,240,0.28); }
@media (prefers-reduced-motion: reduce) { #totop { transition: none; } #totop:hover { transform: none; } }
/* Print and PDF export. The bar itself goes, because a fixed element repeats on
   every page, but the booking link stays and prints its address, so a reader
   working from paper or a PDF can still reach it. */
@media print {
  #totop, .toc, .filters { display: none; }
  .wrap { grid-template-columns: 1fr; }
  .topbar { position: static; border: 0; background: none; backdrop-filter: none; box-shadow: none; }
  .topbar .track, .topbar .mark, .topbar .where, .topbar .pct { display: none; }
  .topbar-inner { height: auto; justify-content: flex-end; padding-block: 8px; }
  .cta { color: var(--brand) !important; background: none !important; padding: 0;
         min-height: 0; font-weight: 600; }
  .cta::after { content: " (" attr(href) ")"; font-weight: 400; color: var(--ink-2); }
  .cta-short { display: none !important; }
  .cta-full { display: inline !important; }
}

@media (max-width: 1023px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .toc { display: none; }
  .hero h1 { font-size: 32px; line-height: 36px; }
  /* Shorter label once the bar gets tight, so nothing overlaps the progress pill. */
  .cta-full { display: none; }
  .cta-short { display: inline; }
  .cta { padding: 0 14px; }
}
@media (max-width: 639px) {
  .topbar-inner { gap: 10px; }
  /* .where carries flex:1 and pushes the right-hand group across, so the CTA
     takes over that job once the breadcrumb is hidden. */
  .where { display: none; }
  .cta { margin-left: auto; padding: 0 12px; font-size: 13px; }
}
</style>
</head>
<body>
<div class="topbar" id="topbar" role="region" aria-label="Reading progress">
  <div class="shell topbar-inner">
    <div class="mark"><i aria-hidden="true"></i><span>Wellows</span></div>
    <div class="where" id="where"><b>Start</b></div>
    <a class="cta" href="https://calendly.com/technical-audit-by-wellows/website-audit"
       target="_blank" rel="noopener noreferrer"
       aria-label="Schedule Your Free Audit Call, opens in a new tab">
      <span class="cta-full">Schedule Your Free Audit Call</span>
      <span class="cta-short">Free Audit Call</span>
    </a>
    <div class="pct" id="pct">0% read</div>
  </div>
  <div class="track" role="progressbar" aria-label="Report read" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="track"><div class="fill" id="fill"></div></div>
</div>
<header class="hero">
  <div class="shell">
    <p class="eyebrow">Technical SEO &middot; AEO &middot; GEO &middot; LLM accessibility audit &middot; %%DATE%%</p>
    <h1>%%H1%%</h1>
    <p class="lead">%%HEADLINE%%</p>
    <div class="tiles">%%TILES%%</div>
  </div>
</header>
<div class="shell wrap">
  <nav class="toc" aria-label="Contents"><h3>Contents</h3><ol id="toc">%%TOC%%</ol></nav>
  <main id="main">
    <div class="filters" role="group" aria-label="Filter checks">
      <h3>Show</h3>
      <button class="chip" data-f="all" aria-pressed="true">All checks</button>
      <button class="chip" data-f="issue" aria-pressed="false">Issues</button>
      <button class="chip" data-f="urgent" aria-pressed="false">Critical and High</button>
      <button class="chip" data-f="pass" aria-pressed="false">Passing</button>
      <button class="chip" data-f="need" aria-pressed="false">Needs client data</button>
      <span id="fcount" aria-live="polite"></span>
    </div>
%%BODY%%
    <p class="foot">Prepared by Wellows for %%CLIENT%% &middot; %%DATE%% &middot; Evidence files available on request.</p>
  </main>
</div>
<button id="totop" type="button" aria-label="Back to top" title="Back to top">&#8593;</button>
<script>
(function () {
  var fill = document.getElementById('fill'), pct = document.getElementById('pct'),
      where = document.getElementById('where'), track = document.getElementById('track'),
      topbar = document.getElementById('topbar'), toTop = document.getElementById('totop');
  var allSecs = Array.prototype.slice.call(document.querySelectorAll('.sec'));
  var links = {}; document.querySelectorAll('#toc a').forEach(function (a) { links[a.dataset.t] = a; });
  var ticking = false;
  toTop.addEventListener('click', function () {
    scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  });
  function update() {
    ticking = false;
    var span = Math.max(1, document.documentElement.scrollHeight - innerHeight);
    var p = Math.round(Math.min(1, Math.max(0, scrollY / span)) * 100);
    fill.style.width = p + '%'; pct.textContent = p + '% read'; track.setAttribute('aria-valuenow', p);
    toTop.classList.toggle('show', scrollY > 600);
    topbar.classList.toggle('pinned', scrollY > 8);
    // Count only what is on screen, so a filter does not leave the progress
    // readout and the contents rail pointing at hidden sections.
    var secs = allSecs.filter(function (s) { return !s.classList.contains('hide'); });
    var line = innerHeight * 0.3, idx = 0;
    secs.forEach(function (s, i) { if (s.getBoundingClientRect().top <= line) idx = i; });
    if (p >= 99) idx = secs.length - 1;
    var cur = secs[idx];
    if (cur) where.textContent = 'Section ' + (idx + 1) + ' of ' + secs.length + ' · ' + cur.dataset.title;
    allSecs.forEach(function (s) { var a = links[s.id]; if (!a) return;
      a.classList.toggle('active', s === cur);
      a.parentElement.classList.toggle('hide', s.classList.contains('hide')); });
  }
  addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(update); } }, { passive: true });
  addEventListener('resize', update); update();
  var chips = document.querySelectorAll('.chip');
  var count = document.getElementById('fcount');
  function matches(f, tr) {
    var v = tr.dataset.v, s = tr.dataset.s;
    return f === 'all' || (f === 'issue' && v === 'issue') || (f === 'pass' && v === 'pass') ||
      (f === 'need' && v === 'need') || (f === 'urgent' && v === 'issue' && (s === 'critical' || s === 'high'));
  }
  function applyFilter(f) {
    var shown = 0;
    document.querySelectorAll('tr[data-v]').forEach(function (tr) {
      var ok = matches(f, tr);
      tr.classList.toggle('hide', !ok);
      if (ok) shown++;
    });
    // Only the check sections are filtered. The narrative sections and the
    // action plan are not results, so they step aside rather than sit there
    // looking like matches, and a check section with nothing left is hidden
    // instead of showing an empty table.
    document.querySelectorAll('.sec').forEach(function (sec) {
      if (f === 'all') { sec.classList.remove('hide'); return; }
      if (sec.dataset.checks) {
        sec.classList.toggle('hide', sec.querySelectorAll('tr[data-v]:not(.hide)').length === 0);
      } else {
        sec.classList.add('hide');
      }
    });
    if (count) {
      count.textContent = f === 'all' ? '' : shown + (shown === 1 ? ' check' : ' checks');
    }
    update();
  }
  function press(f) {
    var hit = null;
    chips.forEach(function (x) {
      var on = x.dataset.f === f;
      if (on) hit = x;
      x.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    if (hit) applyFilter(f);
    return !!hit;
  }
  chips.forEach(function (c) { c.addEventListener('click', function () { press(c.dataset.f); }); });

  // Overview legend rows set the filter as well as jumping to the checks. The
  // href already points at #detail, so this only enriches a link that works
  // without script.
  var MAP = {pass: 'pass', issue: 'issue', need: 'need', critical: 'urgent', high: 'urgent'};
  document.querySelectorAll('#overview a[data-filter]').forEach(function (a) {
    a.addEventListener('click', function () {
      var f = MAP[a.dataset.filter];
      if (f) press(f);
    });
  });
})();
</script>
</body>
</html>
